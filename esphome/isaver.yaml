esphome:
  name: pool-pump
  friendly_name: pool-pump
  on_boot:
    priority: -100
    then:
      - output.turn_off: modbus_write_enable
      - lambda: |-
          id(last_sample_ms) = millis();
          id(run_energy_wh) = 0.0f;
      - text_sensor.template.publish:
          id: modbus_status
          state: "Starting"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ap:
    ap_timeout: 1min
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: sorting_group_current_operations
      name: "Current Operations"
      sorting_weight: 10
    - id: sorting_group_diag
      name: "WiFi & System Info"
      sorting_weight: 40

# -----------------------------------------------------------------------------
# UART / RS-485
# -----------------------------------------------------------------------------
uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 1200
  stop_bits: 1
  data_bits: 8
  parity: NONE
  id: modbus_uart
  debug:
    direction: BOTH
    after:
      timeout: 100ms

output:
  - platform: gpio
    pin: GPIO05
    id: modbus_write_enable

# -----------------------------------------------------------------------------
# Runtime state
# -----------------------------------------------------------------------------
globals:
  - id: last_write_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: run_energy_wh
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: last_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_good_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Consecutive unsuccessful polls. uint32_t avoids the old 256-count rollover.
  - id: fail_count
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: partial_count
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_partial_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

# -----------------------------------------------------------------------------
# Status and device information
# -----------------------------------------------------------------------------
text_sensor:
  - platform: template
    name: "Modbus Status"
    id: modbus_status
    on_value:
      then:
        - lambda: |-
            if (id(modbus_status).state != "Online") {
              if (id(pump_rpm_state).state != 0) {
                id(pump_rpm_state).publish_state(0);
              }
              if (id(pump_rpm).state != 0) {
                id(pump_rpm).publish_state(0);
              }
            }

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      web_server:
        sorting_group_id: sorting_group_diag
    ssid:
      name: "WiFi SSID"
      web_server:
        sorting_group_id: sorting_group_diag
    bssid:
      name: "WiFi BSSID"
      web_server:
        sorting_group_id: sorting_group_diag
    mac_address:
      name: "MAC Address"
      web_server:
        sorting_group_id: sorting_group_diag

  - platform: template
    name: "Uptime (friendly)"
    id: uptime_friendly
    update_interval: 30s
    lambda: |-
      uint32_t secs = (uint32_t) id(uptime_s).state;
      uint32_t days = secs / 86400;
      uint32_t hours = (secs % 86400) / 3600;
      uint32_t minutes = (secs % 3600) / 60;
      uint32_t seconds = secs % 60;
      char buffer[64];
      if (days > 0) {
        snprintf(buffer, sizeof(buffer), "%u d %u h %u m %u s", days, hours, minutes, seconds);
      } else if (hours > 0) {
        snprintf(buffer, sizeof(buffer), "%u h %u m %u s", hours, minutes, seconds);
      } else if (minutes > 0) {
        snprintf(buffer, sizeof(buffer), "%u m %u s", minutes, seconds);
      } else {
        snprintf(buffer, sizeof(buffer), "%u s", seconds);
      }
      return std::string(buffer);
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: version
    name: "ESPHome Version"
    web_server:
      sorting_group_id: sorting_group_diag

# -----------------------------------------------------------------------------
# Pump speed control
# -----------------------------------------------------------------------------
number:
  - platform: template
    name: "Pool Pump RPM"
    id: pump_rpm
    min_value: 0
    max_value: 2900
    step: 1
    set_action:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                auto uart = id(modbus_uart);

                // Drain bytes remaining from the previous transaction.
                while (uart->available() > 0) {
                  uint8_t discarded;
                  uart->read_array(&discarded, 1);
                }

                uint16_t rpm = (uint16_t) x;
                if (rpm < 1200) {
                  rpm = 1;
                }

                uint8_t rpm_hi = (rpm >> 8) & 0xFF;
                uint8_t rpm_lo = rpm & 0xFF;
                uint8_t base[6] = {0xAA, 0xD0, 0x0B, 0xB9, rpm_hi, rpm_lo};

                uint16_t crc = 0xFFFF;
                for (int i = 0; i < 6; i++) {
                  crc ^= base[i];
                  for (int j = 0; j < 8; j++) {
                    if (crc & 0x0001) {
                      crc >>= 1;
                      crc ^= 0xA001;
                    } else {
                      crc >>= 1;
                    }
                  }
                }

                uint8_t packet[8] = {
                  base[0], base[1], base[2], base[3], base[4], base[5],
                  (uint8_t) (crc & 0xFF), (uint8_t) ((crc >> 8) & 0xFF)
                };

                id(modbus_write_enable).turn_on();
                delay(4);
                uart->write_array(packet, sizeof(packet));
                uart->flush();
                delay(8);
                id(modbus_write_enable).turn_off();
                id(last_write_ms) = millis();
            - delay: 500ms
          else:
            - logger.log: "Modbus disabled: skipping RPM write"

# -----------------------------------------------------------------------------
# Pump measurements and diagnostics
# -----------------------------------------------------------------------------
sensor:
  - platform: template
    name: "Current Pool Pump RPM"
    id: pump_rpm_state
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: never
    force_update: false

  - platform: template
    name: "Pump Power (W)"
    id: pump_power_w
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 1
    update_interval: 1s
    icon: "mdi:flash"
    lambda: |-
      float rpm = id(pump_rpm_state).state;
      if (rpm <= 0.0f) return 0.0f;
      const float k = 5.75672131e-07f;
      const float b = 2.665573f;
      return k * powf(rpm, b);
    web_server:
      sorting_group_id: sorting_group_current_operations

  - platform: template
    name: "Pump Flow (L/min)"
    id: pump_flow_lmin
    unit_of_measurement: "L/min"
    accuracy_decimals: 1
    update_interval: 1s
    icon: "mdi:water-pump"
    lambda: |-
      float rpm = id(pump_rpm_state).state;
      if (rpm <= 0.0f) return 0.0f;
      return 230.0f * (rpm / 2900.0f);
    web_server:
      sorting_group_id: sorting_group_current_operations

  - platform: template
    name: "Pump Energy (kWh, current run)"
    id: pump_energy_run_kwh
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 2s
    lambda: |-
      return id(run_energy_wh) * 0.001f;
    web_server:
      sorting_group_id: sorting_group_current_operations

  - platform: template
    name: "Modbus Fail Count"
    id: modbus_fail_count
    unit_of_measurement: "x"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      return (float) id(fail_count);

  - platform: template
    name: "Last Good Age (s)"
    id: last_good_age_s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(last_good_ms) == 0) return 99999.0f;
      return (millis() - id(last_good_ms)) / 1000.0f;

  - platform: template
    name: "Partial Frame Count"
    id: partial_frame_count
    unit_of_measurement: "x"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      return (float) id(partial_count);

  - platform: template
    name: "Last Partial Age (s)"
    id: partial_age_s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(last_partial_ms) == 0) return 0.0f;
      return (millis() - id(last_partial_ms)) / 1000.0f;

  - platform: wifi_signal
    name: "WiFi Signal (dB)"
    id: wifi_rssi_db
    update_interval: 30s
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: internal_temperature
    name: "ESP Internal Temperature"
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: template
    name: "WiFi Signal (%)"
    id: wifi_signal_pct
    update_interval: 30s
    lambda: |-
      float rssi = id(wifi_rssi_db).state;
      float pct = (rssi + 90.0f) * (100.0f / 60.0f);
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;
    unit_of_measurement: "%"
    icon: "mdi:wifi"
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: uptime
    name: "Uptime (s)"
    id: uptime_s
    update_interval: 30s
    web_server:
      sorting_group_id: sorting_group_diag

# -----------------------------------------------------------------------------
# Polling and response parsing
# -----------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                // Do not poll while a speed-write transaction is settling.
                if ((millis() - id(last_write_ms)) < 600) {
                  return;
                }

                auto uart = id(modbus_uart);

                // Every poll begins with an empty hardware and software RX
                // buffer. An incomplete frame can no longer survive forever.
                while (uart->available() > 0) {
                  uint8_t discarded;
                  uart->read_array(&discarded, 1);
                }

                uint8_t req[6] = {0xAA, 0xC3, 0x07, 0xD1, 0x00, 0x00};
                uint16_t crc = 0xFFFF;
                for (int i = 0; i < 6; i++) {
                  crc ^= req[i];
                  for (int j = 0; j < 8; j++) {
                    if (crc & 0x0001) {
                      crc >>= 1;
                      crc ^= 0xA001;
                    } else {
                      crc >>= 1;
                    }
                  }
                }

                uint8_t packet[8] = {
                  req[0], req[1], req[2], req[3], req[4], req[5],
                  (uint8_t) (crc & 0xFF), (uint8_t) ((crc >> 8) & 0xFF)
                };

                id(modbus_write_enable).turn_on();
                delay(4);
                uart->write_array(packet, sizeof(packet));
                uart->flush();
                delay(8);
                id(modbus_write_enable).turn_off();

                uint8_t rx[32];
                size_t rx_len = 0;
                uint32_t started = millis();
                uint32_t last_byte_ms = started;

                // A full eight-byte response takes about 67 ms at 1200 baud.
                // Once seven bytes exist, wait for a short quiet period so the
                // optional eighth or ninth CRC byte is collected too.
                while ((millis() - started) < 250) {
                  while (uart->available() > 0 && rx_len < sizeof(rx)) {
                    uart->read_array(&rx[rx_len], 1);
                    rx_len++;
                    last_byte_ms = millis();
                  }

                  if (rx_len >= 7 && (millis() - last_byte_ms) >= 20) {
                    break;
                  }
                  delay(1);
                }

                bool got_frame = false;
                bool partial_frame = false;
                int frame_start = -1;

                // Known units have been observed with either 00 or 01 in the
                // fifth response byte.
                for (size_t i = 0; i + 4 < rx_len; i++) {
                  bool known_header =
                    rx[i] == 0xAA &&
                    rx[i + 1] == 0xC3 &&
                    rx[i + 2] == 0x00 &&
                    rx[i + 3] == 0x00 &&
                    (rx[i + 4] == 0x00 || rx[i + 4] == 0x01);

                  if (known_header) {
                    frame_start = (int) i;
                    break;
                  }
                }

                if (frame_start >= 0) {
                  size_t available = rx_len - (size_t) frame_start;

                  if (available >= 7) {
                    uint16_t raw =
                      ((uint16_t) rx[frame_start + 5] << 8) |
                      (uint16_t) rx[frame_start + 6];

                    bool valid_value =
                      raw <= 300 ||
                      (raw >= 600 && raw <= 3500);

                    if (valid_value) {
                      uint16_t new_rpm = raw <= 300 ? 0 : raw;

                      if (new_rpm != (uint16_t) id(pump_rpm_state).state) {
                        id(pump_rpm_state).publish_state(new_rpm);
                        id(pump_rpm).publish_state(new_rpm);
                      }

                      if (id(modbus_status).state != "Online") {
                        id(modbus_status).publish_state("Online");
                      }

                      id(last_good_ms) = millis();
                      id(fail_count) = 0;
                      got_frame = true;
                    } else {
                      ESP_LOGW(
                        "pool_modbus",
                        "Rejected out-of-range RPM value: %u",
                        raw
                      );
                    }
                  } else {
                    partial_frame = true;
                    id(partial_count)++;
                    id(last_partial_ms) = millis();
                  }
                }

                // Every unsuccessful poll contributes to recovery, including a
                // recognised but incomplete response.
                if (!got_frame) {
                  id(fail_count)++;

                  if (partial_frame) {
                    ESP_LOGW(
                      "pool_modbus",
                      "Partial response: %u byte(s)",
                      (unsigned) rx_len
                    );
                  } else {
                    ESP_LOGW(
                      "pool_modbus",
                      "No valid response: %u byte(s)",
                      (unsigned) rx_len
                    );
                  }

                  uint32_t age_ms =
                    id(last_good_ms) == 0
                      ? 0xFFFFFFFFUL
                      : millis() - id(last_good_ms);

                  if (id(fail_count) >= 10 || age_ms > 10000) {
                    if (id(pump_rpm_state).state != 0) {
                      id(pump_rpm_state).publish_state(0);
                    }
                    if (id(pump_rpm).state != 0) {
                      id(pump_rpm).publish_state(0);
                    }
                    if (id(modbus_status).state != "Stale") {
                      id(modbus_status).publish_state("Stale");
                    }
                  }
                }
          else:
            - text_sensor.template.publish:
                id: modbus_status
                state: "Disabled"

  - interval: 1s
    then:
      - lambda: |-
          uint32_t now_ms = millis();
          uint32_t dt_ms = now_ms - id(last_sample_ms);
          id(last_sample_ms) = now_ms;

          float power_w = id(pump_power_w).state;
          bool running = id(pump_running).state;

          if (running && power_w > 0.0f) {
            float dt_s = dt_ms / 1000.0f;
            id(run_energy_wh) += power_w * (dt_s / 3600.0f);
          }

# -----------------------------------------------------------------------------
# Controls
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Modbus Enabled"
    id: modbus_enabled_switch
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - text_sensor.template.publish:
          id: modbus_status
          state: "Starting"
    turn_off_action:
      - text_sensor.template.publish:
          id: modbus_status
          state: "Disabled"

  - platform: template
    name: "Pool Pump Power"
    id: pump_power
    lambda: |-
      return id(pump_rpm_state).state >= 1200;
    turn_on_action:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(2100).perform();
          else:
            - logger.log: "Modbus disabled: skipping Power ON"
    turn_off_action:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(0).perform();
          else:
            - logger.log: "Modbus disabled: skipping Power OFF"

button:
  - platform: template
    name: "Pool Pump ECO"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(1350).perform();
          else:
            - logger.log: "Modbus disabled: ECO skipped"

  - platform: template
    name: "Pool Pump NORMAL"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(1700).perform();
          else:
            - logger.log: "Modbus disabled: NORMAL skipped"

  - platform: template
    name: "Pool Pump MAX"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled_switch).state;
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(2900).perform();
          else:
            - logger.log: "Modbus disabled: MAX skipped"

  - platform: template
    name: "Reset Pump Run Energy"
    id: reset_run_energy_btn
    on_press:
      - lambda: |-
          id(run_energy_wh) = 0.0f;
          id(last_sample_ms) = millis();

  - platform: restart
    name: "Restart ESP32"
    id: restart_button
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: safe_mode
    name: "Boot to Safe Mode"
    id: safe_mode_button
    web_server:
      sorting_group_id: sorting_group_diag

binary_sensor:
  - platform: status
    name: "ESP32 Status"
    device_class: connectivity
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: template
    name: "Pump Running"
    id: pump_running
    device_class: running
    lambda: |-
      return id(pump_rpm_state).state >= 1200;
    web_server:
      sorting_group_id: sorting_group_current_operations
