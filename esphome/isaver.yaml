substitutions:
  # Flow rate at max RPM (2900), in litres per hour
  max_flow_lph: "13800"
  # Power consumption at max RPM (2900), in watts
  max_power_w: "976"

esphome:
  name: pool-pump
  friendly_name: pool-pump
  on_boot:
    priority: -100
    then:
      # Initialise current-run energy tracking
      - lambda: |-
          id(last_sample_ms) = millis();
          id(run_energy_wh) = 0.0f;

      # Keep your existing replay of RPM to the drive
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                if (id(pump_rpm).state > 0) {
                  id(pump_rpm).make_call().set_value(id(pump_rpm).state).perform();
                }

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ap:
    ap_timeout: 1min
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

# Optional Bluetooth disabled
# esp32_ble_tracker:
# bluetooth_proxy:
#   active: true

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: sorting_group_current_operations
      name: "Current Operations"
      sorting_weight: 10
    - id: sorting_group_diag
      name: "WiFi & System Info"
      sorting_weight: 40

# -------------------------------
# UART / RS-485
# -------------------------------
uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 1200
  stop_bits: 1
  data_bits: 8
  parity: NONE
  id: modbus_uart
  debug:
    after:
      delimiter: "\n"

output:
  - platform: gpio
    pin: GPIO05
    id: modbus_write_enable

# -------------------------------
# Modbus enable/disable + timing guard
# -------------------------------
globals:
  - id: modbus_enabled
    type: bool
    restore_value: true
    initial_value: 'true'

  # Track last write time to pause polling briefly afterwards
  - id: last_write_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Accumulated energy during the current run (in Wh)
  - id: run_energy_wh
    type: float
    restore_value: false
    initial_value: '0.0'

  # Timestamp of the last accumulation sample (in ms)
  - id: last_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Message health monitoring

  - id: last_good_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: fail_count
    type: uint8_t
    restore_value: false
    initial_value: '0'


  - id: partial_count
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: last_partial_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'



# -------------------------------
# Status / UI
# -------------------------------
text_sensor:
  - platform: template
    name: "Modbus Status"
    id: modbus_status
    # Force RPM to 0 whenever status is not "Online"
    on_value:
      then:
        - lambda: |-
            if (id(modbus_status).state != "Online") {
              // Avoid redundant publishes
              if (id(pump_rpm_state).state != 0) {
                id(pump_rpm_state).publish_state(0);
              }
              // Keep the visible number in sync too
              if (id(pump_rpm).state != 0) {
                id(pump_rpm).publish_state(0);
              }
            }

# Text sensors: network info, human-readable uptime, ESPHome version, heartbeat
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      web_server:
        sorting_group_id: sorting_group_diag
    ssid:
      name: "WiFi SSID"
      web_server:
        sorting_group_id: sorting_group_diag
    bssid:
      name: "WiFi BSSID"
      web_server:
        sorting_group_id: sorting_group_diag
    mac_address:
      name: "MAC Address"
      web_server:
        sorting_group_id: sorting_group_diag

  - platform: template
    name: "Uptime (friendly)"
    id: uptime_friendly
    update_interval: 30s
    lambda: |-
      uint32_t secs = (uint32_t) id(uptime_s).state;
      uint32_t days = secs / 86400;
      uint32_t hours = (secs % 86400) / 3600;
      uint32_t minutes = (secs % 3600) / 60;
      uint32_t seconds = secs % 60;
      char buffer[64];
      if (days > 0) {
        snprintf(buffer, sizeof(buffer), "%u d %u h %u m %u s", days, hours, minutes, seconds);
      } else if (hours > 0) {
        snprintf(buffer, sizeof(buffer), "%u h %u m %u s", hours, minutes, seconds);
      } else if (minutes > 0) {
        snprintf(buffer, sizeof(buffer), "%u m %u s", minutes, seconds);
      } else {
        snprintf(buffer, sizeof(buffer), "%u s", seconds);
      }
      return std::string(buffer);
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: version
    name: "ESPHome Version"
    web_server:
      sorting_group_id: sorting_group_diag

number:
  - platform: template
    name: "Pool Pump RPM"
    id: pump_rpm
    min_value: 0
    max_value: 2900
    step: 1
    set_action:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                id(modbus_write_enable).turn_on();
                uint16_t rpm = (uint16_t)x;
                // Vendor-specific logic: <1200 means "off/stop" command
                if (rpm < 1200) {
                  rpm = 1;
                }
                // Build write frame AA D0 0B B9 <rpm_hi> <rpm_lo> <CRClo> <CRChi>
                uint8_t rpm_hi = (rpm >> 8) & 0xFF;
                uint8_t rpm_lo = rpm & 0xFF;
                uint8_t base[6] = {0xAA, 0xD0, 0x0B, 0xB9, rpm_hi, rpm_lo};
                uint16_t crc = 0xFFFF;
                for (int i = 0; i < 6; i++) {
                  crc ^= base[i];
                  for (int j = 0; j < 8; j++) {
                    if (crc & 0x0001) { crc >>= 1; crc ^= 0xA001; }
                    else { crc >>= 1; }
                  }
                }
                uint8_t packet[8] = {base[0], base[1], base[2], base[3], base[4], base[5],
                                     (uint8_t)(crc & 0xFF), (uint8_t)((crc >> 8) & 0xFF)};
                auto uart = id(modbus_uart);
                // Clear any leftover bytes before writing
                while (uart->available() > 0) {
                  uint8_t t;
                  uart->read_array(&t, 1);
                }
                uart->write_array(packet, 8);
                uart->flush();
                id(modbus_write_enable).turn_off();
                // Mark last write time and pause polling briefly
                id(last_write_ms) = millis();
            - delay: 500ms
          else:
            - logger.log: "Modbus disabled: skipping RPM write"

sensor:
  - platform: template
    name: "Current Pool Pump RPM"
    id: pump_rpm_state
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: never
    force_update: false

  # Empirical best-fit power from RPM (forced through max_power_w @ 2900 RPM)
  - platform: template
    name: "Pump Power (W)"
    id: pump_power_w
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 1
    update_interval: 1s
    icon: "mdi:flash"
    lambda: |-
      float rpm = id(pump_rpm_state).state;
      if (rpm <= 0.0f) return 0.0f;
      const float b = 2.665573f;
      // k = max_power_w / 2900^b
      const float k = ${max_power_w} / powf(2900.0f, b);
      return k * powf(rpm, b);
    web_server:
      sorting_group_id: sorting_group_current_operations

  # Flow is approximately linear with RPM (reference: max_flow_lph @ 2900 RPM)
  - platform: template
    name: "Pump Flow (L/min)"
    id: pump_flow_lmin
    unit_of_measurement: "L/min"
    accuracy_decimals: 1
    update_interval: 1s
    icon: "mdi:water-pump"
    lambda: |-
      float rpm = id(pump_rpm_state).state;
      if (rpm <= 0.0f) return 0.0f;
      return (${max_flow_lph} / 60.0f) * (rpm / 2900.0f);
    web_server:
      sorting_group_id: sorting_group_current_operations

  # Present the current run energy (kWh) from our accumulator
  - platform: template
    name: "Pump Energy (kWh, current run)"
    id: pump_energy_run_kwh
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 2s
    lambda: |-
      return id(run_energy_wh) * 0.001f;  // Wh to kWh
    web_server:
      sorting_group_id: sorting_group_current_operations

  # Message health monitoring

  - platform: template
    name: "Modbus Fail Count"
    id: modbus_fail_count
    unit_of_measurement: "x"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      return id(fail_count);

  - platform: template
    name: "Last Good Age (s)"
    id: last_good_age_s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(last_good_ms) == 0) return 99999;
      return (millis() - id(last_good_ms)) / 1000.0f;


  - platform: template
    name: "Partial Frame Count"
    id: partial_frame_count
    unit_of_measurement: "x"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      return (float) id(partial_count);

  - platform: template
    name: "Last Partial Age (s)"
    id: partial_age_s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(last_partial_ms) == 0) return 0.0f;
      return (millis() - id(last_partial_ms)) / 1000.0f;



# =========================
# Diagnostics
# =========================
  - platform: wifi_signal
    name: "WiFi Signal (dB)"
    id: wifi_rssi_db
    update_interval: 30s
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: internal_temperature
    name: "ESP Internal Temperature"
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: template
    name: "WiFi Signal (%)"
    id: wifi_signal_pct
    update_interval: 30s
    lambda: |-
      // Map typical RSSI range [-90dB .. -30dB] to [0 .. 100%]
      float rssi = id(wifi_rssi_db).state;
      float pct = (rssi + 90.0f) * (100.0f / 60.0f);  // -90 -> 0%, -30 -> 100%
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;
    unit_of_measurement: "%"
    icon: "mdi:wifi"
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: uptime
    name: "Uptime (s)"
    id: uptime_s
    update_interval: 30s
    web_server:
      sorting_group_id: sorting_group_diag

# -------------------------------
# Poll loop (guarded by modbus_enabled, validated frame)
# -------------------------------
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                // Skip briefly after a write to avoid race conditions
                if ((millis() - id(last_write_ms)) < 600) {
                  return;
                }

                auto uart = id(modbus_uart);

                // Build READ packet AA C3 07 D1 00 00 <CRClo> <CRChi>
                uint8_t req[6] = {0xAA, 0xC3, 0x07, 0xD1, 0x00, 0x00};
                uint16_t crc = 0xFFFF;
                for (int i = 0; i < 6; i++) {
                  crc ^= req[i];
                  for (int j = 0; j < 8; j++) {
                    if (crc & 0x0001) { crc >>= 1; crc ^= 0xA001; }
                    else { crc >>= 1; }
                  }
                }
                uint8_t packet[8] = {
                  req[0], req[1], req[2], req[3], req[4], req[5],
                  (uint8_t)(crc & 0xFF), (uint8_t)((crc >> 8) & 0xFF)
                };

                // RS-485 DE/RE guard at 1200 bps (pre/post delays to avoid truncation)
                id(modbus_write_enable).turn_on();
                delay(4);  // pre-TX guard (was 3)
                uart->write_array(packet, sizeof(packet));
                uart->flush();
                delay(8);  // post-TX guard (was 5)
                id(modbus_write_enable).turn_off();

                // Rolling RX buffer across intervals (handles split/partial frames, trailing noise)
                static uint8_t rx[64];
                static size_t rx_len = 0;

                // Collect response bytes for a short window
                uint32_t start = millis();
                while ((millis() - start) < 250) {
                  while (uart->available() > 0 && rx_len < sizeof(rx)) {
                    uart->read_array(&rx[rx_len], 1);
                    rx_len++;
                  }
                  if (rx_len >= 7) break;  // minimum for header + RPM_HI + RPM_LO
                  delay(2);
                }

                bool got_frame = false;
                bool partial_frame = false;

                // Find header AA C3 00 00 01
                int si = -1;
                for (size_t i = 0; i + 4 < rx_len; i++) {
                  if (rx[i] == 0xAA && rx[i+1] == 0xC3 && rx[i+2] == 0x00 && rx[i+3] == 0x00 && rx[i+4] == 0x01) {
                    si = (int)i;
                    break;
                  }
                }

                if (si >= 0) {
                  size_t bytes_after_hdr = rx_len - (si + 5);
                  if (bytes_after_hdr >= 2) {
                    // We have at least a 7-byte frame (header + RPM_HI + RPM_LO)
                    uint16_t raw = ((uint16_t)rx[si+5] << 8) | (uint16_t)rx[si+6];

                    // CRC is OPTIONAL. If present and matching, consume 9; else accept 7 and ignore trailing noise.
                    const bool crc_present = (rx_len >= (si + 9));
                    bool crc_matches = false;
                    if (crc_present) {
                      uint16_t crc_calc = 0xFFFF;
                      for (int k = si; k <= si + 6; k++) {
                        crc_calc ^= rx[k];
                        for (int j = 0; j < 8; j++) {
                          if (crc_calc & 0x0001) { crc_calc >>= 1; crc_calc ^= 0xA001; }
                          else { crc_calc >>= 1; }
                        }
                      }
                      uint16_t crc_rx = (uint16_t)rx[si+7] | ((uint16_t)rx[si+8] << 8);
                      crc_matches = (crc_calc == crc_rx);
                    }

                    // Choose how many bytes to consume from buffer
                    size_t consume_len = crc_matches ? 9 : 7;

                    // Tolerant RPM rules
                    bool valid_value = false;
                    uint16_t new_rpm = 0;
                    if (raw <= 300) {
                      new_rpm = 0;                  // stopped
                      valid_value = true;
                    } else if (raw >= 600 && raw <= 3500) {
                      new_rpm = raw;                // valid running RPM
                      valid_value = true;
                    } else {
                      valid_value = false;          // ignore out-of-range noise
                    }

                    if (valid_value) {
                      if (new_rpm != (uint16_t)id(pump_rpm_state).state) {
                        id(pump_rpm_state).publish_state(new_rpm);
                        id(pump_rpm).publish_state(new_rpm);
                      }
                      if (id(modbus_status).state != "Online") {
                        id(modbus_status).publish_state("Online");
                      }
                      id(last_good_ms) = millis();
                      id(fail_count) = 0;
                      got_frame = true;
                    } else {
                      // We still consider comms good. Keep RPM, keep status "Online".
                      if (id(modbus_status).state != "Online") {
                        id(modbus_status).publish_state("Online");
                      }
                      id(last_good_ms) = millis();
                      id(fail_count) = 0;
                      got_frame = true;
                    }

                    // Consume exactly 7 bytes if CRC absent/mismatched, else 9
                    size_t consume = si + consume_len;
                    if (consume > rx_len) consume = rx_len;
                    size_t rem = rx_len - consume;
                    if (rem > 0) {
                      memmove(rx, rx + consume, rem);
                    }
                    rx_len = rem;

                  } else {
                    // Header found but incomplete: count partial, but do not change status or RPM
                    partial_frame = true;
                    id(partial_count) = id(partial_count) + 1;
                    id(last_partial_ms) = millis();
                    // Keep header in buffer for next tick (do not consume)
                  }
                } else {
                  // No header visible; trim buffer if it grows with idle noise (e.g., long runs of 0xFF)
                  if (rx_len >= sizeof(rx) / 2) {
                    const size_t keep = 4;
                    if (rx_len > keep) {
                      memmove(rx, rx + (rx_len - keep), keep);
                      rx_len = keep;
                    }
                  }
                }

                // Final decision: partials do NOT change status; only true misses increment fail_count
                if (!got_frame) {
                  if (partial_frame) {
                    // Do nothing: keep status and RPM as-is. No fail_count++.
                  } else {
                    // True miss (no usable header/frame this cycle)
                    id(fail_count) = id(fail_count) + 1;

                    // If you want to avoid status churn, leave "No Response" suppressed here.
                    // You can enable it only after >1 consecutive miss by uncommenting below.
                    // bool was_online = (id(modbus_status).state == "Online");
                    // if (!was_online || id(fail_count) > 1) {
                    //   if (id(modbus_status).state != "No Response") {
                    //     id(modbus_status).publish_state("No Response");
                    //   }
                    // }

                    // Watchdog: 10 seconds since last good frame OR 10 true misses
                    uint32_t now = millis();
                    if (id(last_good_ms) != 0) {
                      uint32_t age_ms = now - id(last_good_ms);
                      if (age_ms > 10000 || id(fail_count) >= 10) {
                        if (id(pump_rpm_state).state != 0) {
                          id(pump_rpm_state).publish_state(0);
                          id(pump_rpm).publish_state(0);
                        }
                        if (id(modbus_status).state != "Stale") {
                          id(modbus_status).publish_state("Stale");
                        }
                      }
                    }
                  }
                }
          else:
            - text_sensor.template.publish:
                id: modbus_status
                state: "Disabled"


  - interval: 1s
    then:
      - lambda: |-
          // Compute delta time since last sample
          uint32_t now_ms = millis();
          uint32_t dt_ms = now_ms - id(last_sample_ms);
          id(last_sample_ms) = now_ms;

          // Only accumulate when the pump is running and power is positive
          float power_w = id(pump_power_w).state;  // Watts
          bool running = id(pump_running).state;

          if (running && power_w > 0.0f) {
            // Wh += W * (dt_seconds / 3600)
            float dt_s = dt_ms / 1000.0f;
            id(run_energy_wh) += power_w * (dt_s / 3600.0f);
          } else {
            // Do nothing when not running; we keep the last run energy until reset
            ;
          }

# -------------------------------
# Controls
# -------------------------------
switch:
  - platform: template
    name: "Modbus Enabled"
    id: modbus_enabled_switch
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(modbus_enabled) = true;
          id(modbus_status).publish_state("Online");
    turn_off_action:
      - lambda: |-
          id(modbus_enabled) = false;
          id(modbus_status).publish_state("Disabled");

  - platform: template
    name: "Pool Pump Power"
    id: pump_power
    optimistic: true
    turn_on_action:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(2100).perform();
          else:
            - logger.log: "Modbus disabled: skipping Power ON"
    turn_off_action:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(0).perform();
          else:
            - logger.log: "Modbus disabled: skipping Power OFF"

button:
  - platform: template
    name: "Pool Pump ECO"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(1350).perform();
          else:
            - logger.log: "Modbus disabled: ECO skipped"

  - platform: template
    name: "Pool Pump NORMAL"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(1700).perform();
          else:
            - logger.log: "Modbus disabled: NORMAL skipped"

  - platform: template
    name: "Pool Pump MAX"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(modbus_enabled);
          then:
            - lambda: |-
                id(pump_rpm).make_call().set_value(2900).perform();
          else:
            - logger.log: "Modbus disabled: MAX skipped"

  - platform: template
    name: "Reset Pump Run Energy"
    id: reset_run_energy_btn
    on_press:
      - lambda: |-
          id(run_energy_wh) = 0.0f;
          // Reset sample clock to avoid a big dt on next tick
          id(last_sample_ms) = millis();

# Buttons: restart / safe mode
  - platform: restart
    name: "Restart ESP32"
    id: restart_button
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: safe_mode
    name: "Boot to Safe Mode"
    id: safe_mode_button
    web_server:
      sorting_group_id: sorting_group_diag

binary_sensor:
  - platform: status
    name: "ESP32 Status"
    device_class: connectivity
    web_server:
      sorting_group_id: sorting_group_diag

  - platform: template
    name: "Pump Running"
    id: pump_running
    device_class: running
    lambda: |-
      // Consider the pump running when RPM is >= 1200; adjust if needed
      return id(pump_rpm_state).state >= 1200;
    web_server:
      sorting_group_id: sorting_group_current_operations
